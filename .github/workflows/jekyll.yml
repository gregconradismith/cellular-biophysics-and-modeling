name: Build Jekyll site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/jekyll.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Remove private artifacts from Pages output
        run: |
          find _site -type f -iname "*.pdf" -delete
          rm -f _site/HANDOFF.md

      - name: Restore public Lecture 6 PDFs
        run: |
          mkdir -p _site/wp-content/uploads/2025/09 _site/wp-content/uploads/2024/09
          cp docs/wp-content/uploads/2025/09/Lecture6-GHKTheoryRectification.pdf _site/wp-content/uploads/2025/09/
          cp docs/wp-content/uploads/2024/09/Lecture6_NernstKchannelsGHK.pdf _site/wp-content/uploads/2024/09/
          cp docs/wp-content/uploads/2024/09/Lecture6_problemSet.pdf _site/wp-content/uploads/2024/09/
          cp docs/wp-content/uploads/2024/09/nernst_equilibrium_potential.pdf _site/wp-content/uploads/2024/09/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
