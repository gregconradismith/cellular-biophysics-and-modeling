          wp-content/uploads/2025/09/Lecture3-CompartmentModelPhaseDiagramExponentialRelaxationPhysicalDimensions.pdf
          wp-content/uploads/2025/09/Lecture4-NernstEquilibriumPotentialAndGHKVoltageEquation.pdf
          wp-content/uploads/2025/09/Lecture5-RCCircuitTheoryOfPlasmaMembrane.pdf
          wp-content/uploads/2025/09/Lecture6-GHKTheoryRectification.pdf
