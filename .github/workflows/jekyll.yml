name: Build Jekyll site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/jekyll.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Remove private artifacts from Pages output
        run: |
          find _site -type f -iname "*.pdf" -delete
          rm -f _site/HANDOFF.md

      - name: Restore public lecture PDFs
        run: |
          while IFS= read -r file; do
            mkdir -p "_site/$(dirname "$file")"
            cp "docs/$file" "_site/$file"
          done <<'EOF'
          wp-content/uploads/2024/09/ClosedFormSolution.pdf
          wp-content/uploads/2024/09/GHK-derivation.pdf
          wp-content/uploads/2024/09/Lecture1_2024_NeuronDoctrineDynamics.pdf
          wp-content/uploads/2024/09/Lecture1_problemSet.pdf
          wp-content/uploads/2024/09/Lecture2_2024_CompartModPhaseDiagUnitsTau.pdf
          wp-content/uploads/2024/09/Lecture2_problemSet.pdf
          wp-content/uploads/2024/09/Lecture3_2024_LigandsReceptorsRateLaws.pdf
          wp-content/uploads/2024/09/Lecture3_problemSet.pdf
          wp-content/uploads/2024/09/Lecture4_2024_PostsynapticPotCharTimeQualAnalysis.pdf
          wp-content/uploads/2024/09/Lecture4_problemSet.pdf
          wp-content/uploads/2024/09/Lecture5_LiinearStabilityBifurcations.pdf
          wp-content/uploads/2024/09/Lecture5_problemSet.pdf
          wp-content/uploads/2024/09/Lecture6_NernstKchannelsGHK.pdf
          wp-content/uploads/2024/09/Lecture6_problemSet.pdf
          wp-content/uploads/2024/09/Lecture7_CurrentBalancePassiveNeuronODE.pdf
          wp-content/uploads/2024/09/Lecture7_problemSet.pdf
          wp-content/uploads/2024/09/Lecture8_GHK.pdf
          wp-content/uploads/2024/09/Lecture8_problemSet.pdf
          wp-content/uploads/2024/09/nernst_equilibrium_potential.pdf
          wp-content/uploads/2024/10/HHmodelEquations.pdf
          wp-content/uploads/2024/10/Lecture10_Vdep_bistable.pdf
          wp-content/uploads/2024/10/Lecture10_problemSet.pdf
          wp-content/uploads/2024/10/Lecture11-1_voltageClampHH.pdf
          wp-content/uploads/2024/10/Lecture11-2_voltageClampHH.pdf
          wp-content/uploads/2024/10/Lecture11-3_voltageClampHH.pdf
          wp-content/uploads/2024/10/Lecture11_problemSet.pdf
          wp-content/uploads/2024/10/Lecture12-1_MorrisLecar.pdf
          wp-content/uploads/2024/10/Lecture12-2_MorrisLecar.pdf
          wp-content/uploads/2024/10/Lecture12-3_MorrisLecar.pdf
          wp-content/uploads/2024/10/Lecture12_problemSet.pdf
          wp-content/uploads/2024/10/Lecture13-(PhasePlaneLinearNonlinear).pdf
          wp-content/uploads/2024/10/Lecture13_problemSet.pdf
          wp-content/uploads/2024/10/Lecture14-(FitzhughNagumo).pdf
          wp-content/uploads/2024/10/Lecture14-problemSet.pdf
          wp-content/uploads/2024/10/Lecture9_VGated_currents.pdf
          wp-content/uploads/2024/10/Lecture9_problemSet.pdf
          wp-content/uploads/2024/11/Lecture15-(MorrisLecar2types).pdf
          wp-content/uploads/2024/11/Lecture15-problemSet.pdf
          wp-content/uploads/2024/11/Lecture16-(newBifsBursting).pdf
          wp-content/uploads/2024/11/Lecture16-problemSet.pdf
          wp-content/uploads/2024/11/Lecture17-(ellipticParabolic).pdf
