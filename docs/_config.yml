title: Cellular Biophysics & Modeling
description: "Resources for exploring excitable cells, electrophysiology, and nonlinear dynamics"
url: ""
baseurl: ""
original_site: ""
exported: ""

markdown: kramdown
future: true
permalink: /posts/:slug/

collections:
  materials:
    output: true
    permalink: /pages/:name/

defaults:
  - scope:
      path: ""
      type: materials
    values:
      layout: page
      kind: page
  - scope:
      path: ""
      type: posts
    values:
      layout: page
      kind: post

exclude:
  - Gemfile
  - Gemfile.lock
  - HANDOFF.md
  - vendor
  - README.md
  - "wp-content/uploads/**/*.pdf"
  - "wp-content/uploads/**/*.PDF"
