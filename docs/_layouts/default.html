<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  <script data-goatcounter="https://gregconradismith.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  {% unless page.hide_header %}
  <header class="site-header" aria-label="Site header">
    <div class="masthead">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <p>{{ site.description | escape }}</p>
    </div>
    {% include navigation.html %}
  </header>
  {% endunless %}
  <main>
{{ content }}
  </main>
</body>
</html>
